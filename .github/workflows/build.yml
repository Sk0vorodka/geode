name: Build Binaries (GD 2.2091 rebuild)

on:
  workflow_dispatch:
  push:
    branches:
    - rebuild-2091

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache
  base-configure-command: >-
    cmake -B build
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"
    -G Ninja
  base-build-command: |
    cmake --build build --config RelWithDebInfo --parallel
    rm bin/nightly/resources/.geode_cache

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup caches
      uses: ./.github/actions/setup-cache
      with:
        host: linux
        target: win
        use-ccache: true

    - name: Setup Ninja
      uses: ./.github/actions/setup-ninja
      with:
        host: linux

    - name: Setup CLI
      uses: geode-sdk/cli/.github/actions/setup@main

    - name: Download xwin
      uses: robinraju/release-downloader@v1.10
      with:
        repository: Jake-Shadle/xwin
        latest: true
        fileName: 'xwin-*-x86_64-unknown-linux-musl.tar.gz'
        tarBall: false
        zipBall: false
        out-file-path: "epic-xwin"

    - name: Prepare xwin
      run: |
        tar -xzf epic-xwin/xwin-*-x86_64-unknown-linux-musl.tar.gz -C epic-xwin
        mv epic-xwin/xwin-*-x86_64-unknown-linux-musl/xwin ./xwin
        ./xwin --arch x86_64 --sdk-version 10.0.22621 --accept-license list

    - name: Setup xwin Cache
      id: xwin-cache
      uses: actions/cache@v4
      with:
        path: .xwin-cache
        key: xwin-win-v1-${{ hashFiles('.xwin-cache/**/*') }}

    - name: Download Windows headers
      run: ./xwin --arch x86_64 --sdk-version 10.0.26100 --accept-license splat --include-debug-libs
      if: steps.xwin-cache.outputs.cache-hit != 'true'

    - name: Download clang-msvc-sdk toolchain
      uses: actions/checkout@v4
      with:
        repository: 'geode-sdk/clang-msvc-sdk'
        path: toolchain
        submodules: recursive

    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y wget lsb-release software-properties-common gnupg

        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all

    - name: Add LLVM 21 to path
      run: echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

    - name: Verify LLVM
      run: |
        which clang-cl
        which lld-link
        clang-cl --version
        lld-link --version

    - name: Show bindings commit
      run: |
        git clone --depth 1 https://github.com/geode-sdk/bindings bindings-info
        echo "bindings at: $(git -C bindings-info rev-parse HEAD) ($(git -C bindings-info log -1 --format=%ci))"

    - name: Configure
      run: >
        ${{ env.base-configure-command }}
        -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN
        -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
        -DGEODE_UNITY_BUILD=ON
      env:
        SPLAT_DIR: ${{ github.workspace }}/.xwin-cache/splat
        TOOLCHAIN: ${{ github.workspace }}/toolchain/clang-cl-msvc.cmake
        HOST_ARCH: x86_64

    - name: Build
      run: ${{ env.base-build-command }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-win
        path: ./bin/nightly

    - name: Package Installer
      run: |
        sudo apt install nsis
        makensis -WX -V3 ./installer/windows/installer.nsi

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: geode-installer-win
        path: './installer/windows/geode-installer-win.exe'

  publish:
    name: Publish binaries as release (downloadable without api.github.com)
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: geode-win
        path: geode-win
    - uses: actions/download-artifact@v4
      with:
        name: geode-installer-win
        path: installer
    - name: Create release and upload
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="rebuild2091-r${GITHUB_RUN_NUMBER}"
        (cd geode-win && zip -qr ../geode-win-"$tag".zip .)
        gh release create "$tag" \
          --title "Geode v6 rebuild for GD 2.2091 ($tag)" \
          --notes "Automated rebuild of geode-sdk/geode v6 ($(git rev-parse --short HEAD)) with latest geode-sdk/bindings main. Built for Geometry Dash 2.2091." \
          --prerelease --target "$GITHUB_SHA" || echo "release already exists"
        gh release upload "$tag" \
          "geode-win-$tag.zip" \
          "installer/geode-installer-win.exe" \
          --clobber
