# Codemagic CI for building Geode (Windows loader) targeting GD 2.2091.
#
# Build strategy (no changes to Geode sources needed):
#   - The upstream v6 branch of geode-sdk/geode is the tree with native
#     GD 2.2091 support (updated cocos headers etc.). Official main (5.11.x)
#     only supports 2.2081 natively and runs on 2.209x in forward-compat.
#     We clone and build upstream v6; this repository only carries the CI.
#   - Runs on mac_mini_m2 (free-tier instance) and cross-compiles for Windows
#     using LLVM clang-cl + lld-link, exactly like Geode's own official CI, which
#     cross-compiles Windows builds on Linux. The Windows SDK / MSVC CRT headers
#     and libs are downloaded/normalized locally by `xwin` (brew package).
#   - Target GD version is provided purely through CMake variables:
#       GEODE_GD_VERSION=2.2091   -> the running exe has PE TimeDateStamp
#                                    1792203143 (2026-10-17 02:12 UTC), which
#                                    maps to "2.2091", so the loader recognizes
#                                    the game and exits forward-compat mode.
#       GEODE_COMP_GD_VERSION=22091 -> numeric version gates (2.2091)
#       GEODE_BINDINGS_PATH=<pinned bindings>/bindings/2.2091 -> 2.2091 dataset
#   - Bindings are pinned to a known-good commit of geode-sdk/bindings main.

workflows:
  win-gd-2091:
    name: Geode Windows for GD 2.2091
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.6
      vars:
        XWIN_SDK: "10.0.26100"
        XWIN_ARCH: "x86_64"
        # pinned commit of geode-sdk/bindings (main), contains bindings/2.2091
        BINDINGS_REF: "619c7de3cac2d14e57ca67ab7820057d079ddca6"
        # GD 2.2091: dotted version (maps to PE TimeDateStamp 1792203143)
        GEO_VER_TARGET: "2.2091"
        GEO_COMP_TARGET: "22091"
    cache:
      cache_paths:
        - ~/.cpm-cache
        - ~/.xwin-cache
    scripts:
      - name: Install build tools (xwin, ninja, cmake, llvm, lld)
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          # NOTE: homebrew 'llvm' no longer ships lld/lld-link (split into the
          # separate 'lld' formula since LLVM 19) - both must be installed.
          for f in xwin ninja cmake llvm lld; do
            if ! command -v "$f" >/dev/null 2>&1; then
              echo ":: installing $f"
              brew install "$f"
            fi
          done
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          echo "LLVM: $(clang-cl --version | head -1)"
          echo "cmake: $(cmake --version | head -1)"
          echo "ninja: $(ninja --version)"
          echo "== tool sanity check =="
          for cmd in clang-cl lld-link llvm-lib llvm-mt llvm-rc llvm-nm clang clang++; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "  $cmd -> $(command -v $cmd)"
            else
              echo "  MISSING: $cmd"
            fi
          done

      - name: Fetch Windows SDK + MSVC CRT via xwin (splat)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.xwin-cache"
          xwin --cache-dir "$HOME/.xwin-cache" --arch "$XWIN_ARCH" --sdk-version "$XWIN_SDK" \
            --accept-license splat --include-debug-libs
          echo "--- splat layout ---"
          ls "$HOME/.xwin-cache/splat"

      - name: Clone upstream geode v6 (native 2.209 support tree)
        script: |
          set -euo pipefail
          # geode-sdk/geode main (5.11.x) only supports GD 2.2081 natively and
          # runs on 2.209 in forward-compat mode. The v6 branch is the WIP tree
          # with 2.209/2.2091 support (updated cocos headers, new dispatchers,
          # timestamps). We build THAT tree, not the repository Codemagic
          # fetched (this repo only carries codemagic.yaml).
          git clone --depth 1 -b v6 https://github.com/geode-sdk/geode "$CM_BUILD_DIR/upstream-v6"
          echo "v6 tree at: $(git -C "$CM_BUILD_DIR/upstream-v6" rev-parse HEAD)"

      - name: Clone clang-msvc-sdk toolchain and pinned bindings
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git clone --depth 1 https://github.com/geode-sdk/clang-msvc-sdk clang-msvc-sdk
          git clone --depth 1 https://github.com/geode-sdk/bindings bindings-repo
          (cd bindings-repo && git checkout --detach "$BINDINGS_REF")
          echo "bindings pinned at: $(git -C bindings-repo rev-parse HEAD)"

      - name: Install Geode CLI (v3.9.0, macOS)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -L --fail -o /tmp/geode-cli.zip \
            "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-mac.zip"
          unzip -o /tmp/geode-cli.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/geode"
          "$HOME/bin/geode" --version || echo "geode CLI: (version unavailable)"

      - name: Configure + build geode-loader (Windows x64, GD 2.2091)
        script: |
          set -euo pipefail
          export PATH="$HOME/bin:$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          export CPM_SOURCE_CACHE="$HOME/.cpm-cache"
          # Use the pinned bindings clone (checked out at $BINDINGS_REF above)
          # instead of letting CPM fetch 'main'. Env var is read by geode's
          # top-level CMakeLists (lines 72-95).
          export GEODE_BINDINGS_REPO_PATH="$CM_BUILD_DIR/bindings-repo"
          mkdir -p "$CPM_SOURCE_CACHE"
          cd "$CM_BUILD_DIR/upstream-v6"

          echo "== configure =="
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$CM_BUILD_DIR/clang-msvc-sdk/clang-cl-msvc.cmake" \
            -DSPLAT_DIR="$HOME/.xwin-cache/splat" \
            -DHOST_ARCH="$XWIN_ARCH" \
            -DGEODE_GD_VERSION="$GEO_VER_TARGET" \
            -DGEODE_COMP_GD_VERSION="$GEO_COMP_TARGET" \
            -DGEODE_BINDINGS_PATH="$CM_BUILD_DIR/bindings-repo/bindings/2.2091" \
            -DGEODE_UNITY_BUILD=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"

          echo "== build =="
          cmake --build build --config RelWithDebInfo --parallel

          rm -rf bin/nightly/resources/.geode_cache

          echo "== output =="
          find "$CM_BUILD_DIR/upstream-v6/bin/nightly" -maxdepth 2 | sort

    artifacts:
      - upstream-v6/bin/nightly/Geode.dll
      - upstream-v6/bin/nightly/Geode.lib
      - upstream-v6/bin/nightly/Geode.pdb
      - upstream-v6/bin/nightly/XInput1_4.dll
      - upstream-v6/bin/nightly/GeodeUpdater.exe
      - upstream-v6/bin/nightly/resources/**/*
    publishing:
      email:
        recipients:
          - artemkakartasev@gmail.com

  # ---------------------------------------------------------------------------
  # Pilot: build a third-party Geode mod for GD 2.2091 Windows.
  #
  # Proof-of-concept that mods can be rebuilt against the v6 (2.2091) SDK in
  # this cross-compile pipeline. Target: FireMario211/Golden-Best
  # (open source, no mod dependencies, single translation unit).
  #
  # No changes to Geode SDK sources; no changes to the mod's C++ sources.
  # Only mod.json's Windows gd target is rewritten to 2.2091 because the
  # binary is genuinely rebuilt against the 2.2091 bindings/SDK in this job.
  # For personal use only - nothing is published to the Geode index.
  # ---------------------------------------------------------------------------
  win-mod-goldenbest-2091:
    name: GoldenBest Windows for GD 2.2091 (v6 pilot)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.6
      vars:
        XWIN_SDK: "10.0.26100"
        XWIN_ARCH: "x86_64"
        BINDINGS_REF: "619c7de3cac2d14e57ca67ab7820057d079ddca6"
        GEO_VER_TARGET: "2.2091"
        GEO_COMP_TARGET: "22091"
        # pinned trees for reproducible mod builds
        GEODE_V6_REF: "777c2b6"
        MOD_REPO: "https://github.com/FireMario211/Golden-Best"
        MOD_REF: "04671b99f9e02264b588297c8ccf6bfd6fbaf08a"
    cache:
      cache_paths:
        - ~/.cpm-cache
        - ~/.xwin-cache
    scripts:
      - name: Install build tools (xwin, ninja, cmake, llvm, lld)
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for f in xwin ninja cmake llvm lld; do
            if ! command -v "$f" >/dev/null 2>&1; then
              brew install "$f"
            fi
          done
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          echo "LLVM: $(clang-cl --version | head -1)"

      - name: Fetch Windows SDK + MSVC CRT via xwin (splat)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.xwin-cache"
          xwin --cache-dir "$HOME/.xwin-cache" --arch "$XWIN_ARCH" --sdk-version "$XWIN_SDK" \
            --accept-license splat --include-debug-libs

      - name: Clone pinned trees (geode v6, toolchain, bindings, mod)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git clone --depth 1 https://github.com/geode-sdk/geode upstream-v6
          (cd upstream-v6 && git fetch --depth 1 origin "$GEODE_V6_REF" && git checkout --detach FETCH_HEAD)
          git clone --depth 1 https://github.com/geode-sdk/clang-msvc-sdk clang-msvc-sdk
          git clone --depth 1 https://github.com/geode-sdk/bindings bindings-repo
          (cd bindings-repo && git checkout --detach "$BINDINGS_REF")
          echo "geode v6 pinned at: $(git -C upstream-v6 rev-parse HEAD)"
          git clone --depth 1 "$MOD_REPO" goldenbest-mod
          (cd goldenbest-mod && git fetch --depth 1 origin "$MOD_REF" && git checkout --detach FETCH_HEAD)
          echo "mod pinned at: $(git -C goldenbest-mod rev-parse HEAD)"

      - name: Retarget mod metadata to GD 2.2091 (Windows only)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/goldenbest-mod"
          # The binary is rebuilt against 2.2091 bindings in this job, so the
          # Windows game-version declaration becomes 2.2091.
          sed -i 's/"win": "2.2081"/"win": "2.2091"/' mod.json
          echo "--- mod.json gd after retarget ---"
          grep -A5 '"gd"' mod.json

      - name: Install Geode CLI (v3.9.0, macOS)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -L --fail -o /tmp/geode-cli.zip \
            "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-mac.zip"
          unzip -o /tmp/geode-cli.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/geode"
          "$HOME/bin/geode" --version || echo "geode CLI: (version unavailable)"

      - name: Configure + build mod for Windows x64 (GD 2.2091)
        script: |
          set -euo pipefail
          export PATH="$HOME/bin:$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          export CPM_SOURCE_CACHE="$HOME/.cpm-cache"
          # The mod consumes the SDK in-tree (add_subdirectory($ENV{GEODE_SDK})).
          export GEODE_SDK="$CM_BUILD_DIR/upstream-v6"
          # Pinned bindings, read by geode's top-level CMakeLists.
          export GEODE_BINDINGS_REPO_PATH="$CM_BUILD_DIR/bindings-repo"
          mkdir -p "$CPM_SOURCE_CACHE"
          cd "$CM_BUILD_DIR/goldenbest-mod"

          echo "== configure =="
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$CM_BUILD_DIR/clang-msvc-sdk/clang-cl-msvc.cmake" \
            -DSPLAT_DIR="$HOME/.xwin-cache/splat" \
            -DHOST_ARCH="$XWIN_ARCH" \
            -DGEODE_GD_VERSION="$GEO_VER_TARGET" \
            -DGEODE_COMP_GD_VERSION="$GEO_COMP_TARGET" \
            -DGEODE_BINDINGS_PATH="$CM_BUILD_DIR/bindings-repo/bindings/2.2091" \
            -DGEODE_UNITY_BUILD=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"

          echo "== build =="
          cmake --build build --config RelWithDebInfo --parallel

          echo "== output .geode =="
          find "$CM_BUILD_DIR/goldenbest-mod/build" -name "*.geode" -maxdepth 2 -exec ls -la {} \;

    artifacts:
      - goldenbest-mod/build/*.geode
    publishing:
      email:
        recipients:
          - artemkakartasev@gmail.com
